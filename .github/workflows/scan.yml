# secrev-scan: reusable, advisory security scan for pull requests.
#
# GENERATED by scripts/build.py from scanners/scan.template.yml and the files in scanners/.
# Edit those sources and rebuild instead of editing this file.
#
# Report-only by design: the job always succeeds and uses no secrets. Results are uploaded
# as the `secrev-scan` artifact, which the n8n reviewer downloads when the run completes.
name: secrev-scan (reusable)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  scan:
    name: secrev-scan (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Write scanner files
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/secrev"
          cat > "$RUNNER_TEMP/secrev/run-scanners.sh" <<'SECREV_EOF'
          #!/usr/bin/env bash
          # secrev scanner runner.
          #
          # Runs inside the reusable GitHub Actions workflow (embedded by scripts/build.py) and
          # locally in tests. It never fails the job: every tool runs report-only, and problems
          # are recorded per tool in the bundle that n8n reads.
          #
          # Required env: BASE_SHA, HEAD_SHA, OUT_DIR
          # Optional env: SECREV_DIR (configs; default: this script's dir), SECREV_INSTALL=1 (CI),
          #               SECREV_TMP, TOOL_TIMEOUT (seconds), GH_TOKEN (zizmor online audits),
          #               SECREV_REPO, SECREV_PR, SECREV_RUN_ID, SECREV_RUN_ATTEMPT (bundle metadata)
          set -uo pipefail

          : "${BASE_SHA:?BASE_SHA is required}" "${HEAD_SHA:?HEAD_SHA is required}" "${OUT_DIR:?OUT_DIR is required}"
          SECREV_DIR="${SECREV_DIR:-$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)}"
          SECREV_TMP="${SECREV_TMP:-${RUNNER_TEMP:-/tmp}/secrev-work}"
          SECREV_INSTALL="${SECREV_INSTALL:-0}"
          TOOL_TIMEOUT="${TOOL_TIMEOUT:-300}"
          MAX_DIRS=10
          MAX_FILES=200

          set -a
          # shellcheck disable=SC1091  # sourced at runtime from SECREV_DIR
          . "$SECREV_DIR/versions.env"
          set +a
          mkdir -p "$OUT_DIR" "$SECREV_TMP"
          log() { printf '[secrev] %s\n' "$*" >&2; }

          # ---------------------------------------------------------------- changed files
          CHANGED="$SECREV_TMP/changed.txt"
          if ! git diff --name-only --diff-filter=ACMR "$BASE_SHA...$HEAD_SHA" > "$CHANGED" 2> "$SECREV_TMP/git-diff.log"; then
            log "git diff failed (is the history fetched?): $(head -c 300 "$SECREV_TMP/git-diff.log")"
            : > "$CHANGED"
          fi
          log "changed files: $(wc -l < "$CHANGED")"

          matching() { grep -E "$1" "$CHANGED" | head -n "$MAX_FILES" || true; }
          TF_FILES=$(matching '\.(tf|tfvars|hcl)$|\.tf\.json$')
          PY_FILES=$(matching '\.py$')
          JS_FILES=$(matching '\.(js|jsx|mjs|cjs|ts|tsx|vue|svelte)$')
          GHA_FILES=$(matching '^\.github/(workflows|actions)/.*\.ya?ml$')
          DOCKER_FILES=$(matching '(^|/)Dockerfile[^/]*$|\.dockerfile$')
          ANSIBLE_FILES=$(matching '(^|/)(roles|playbooks|group_vars|host_vars|inventory|inventories|tasks|handlers)/.*\.ya?ml$|(^|/)(site|main|playbook[^/]*)\.ya?ml$|(^|/)ansible\.cfg$')
          # A YAML file only counts as Ansible when the repo looks like an Ansible project.
          if [ -n "$ANSIBLE_FILES" ] && ! { [ -f ansible.cfg ] || [ -d roles ] || [ -d playbooks ] || [ -d group_vars ] \
              || [ -d inventory ] || [ -d inventories ] || ls ./*playbook*.yml ./site.yml >/dev/null 2>&1; }; then
            ANSIBLE_FILES=""
          fi

          domains=()
          [ -n "$TF_FILES" ] && domains+=(terraform)
          [ -n "$ANSIBLE_FILES" ] && domains+=(ansible)
          [ -n "$PY_FILES" ] && domains+=(python)
          [ -n "$JS_FILES" ] && domains+=(javascript)
          [ -n "$GHA_FILES" ] && domains+=(github-actions)
          [ -n "$DOCKER_FILES" ] && domains+=(docker)
          export SECREV_DOMAINS="${domains[*]:-}"
          log "domains: ${SECREV_DOMAINS:-none}"

          # ---------------------------------------------------------------- install (CI only)
          pip_install() { python3 -m pip install --quiet --disable-pip-version-check --no-input "$@"; }
          if [ "$SECREV_INSTALL" = "1" ]; then
            # shellcheck disable=SC1091  # created just above
            python3 -m venv "$SECREV_TMP/venv" && . "$SECREV_TMP/venv/bin/activate"
            pkgs=()
            [ -n "$TF_FILES$ANSIBLE_FILES$DOCKER_FILES" ] && pkgs+=("checkov==$CHECKOV_VERSION")
            [ -n "$ANSIBLE_FILES" ] && pkgs+=("ansible-lint==$ANSIBLE_LINT_VERSION" "ansible-core==$ANSIBLE_CORE_VERSION")
            [ -n "$PY_FILES" ] && pkgs+=("bandit[sarif]==$BANDIT_VERSION")
            [ -n "$PY_FILES$JS_FILES$GHA_FILES" ] && pkgs+=("semgrep==$SEMGREP_VERSION")
            [ -n "$GHA_FILES" ] && pkgs+=("zizmor==$ZIZMOR_VERSION")
            if [ "${#pkgs[@]}" -gt 0 ]; then
              log "installing: ${pkgs[*]}"
              pip_install "${pkgs[@]}" > "$SECREV_TMP/pip.log" 2>&1 || log "pip install failed: $(tail -c 500 "$SECREV_TMP/pip.log")"
            fi
            mkdir -p "$SECREV_TMP/bin"
            tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
            if curl -sSfL -o "$SECREV_TMP/$tarball" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}" \
               && echo "${GITLEAKS_SHA256_LINUX_X64}  $SECREV_TMP/$tarball" | sha256sum -c --quiet -; then
              tar -xzf "$SECREV_TMP/$tarball" -C "$SECREV_TMP/bin" gitleaks
            else
              log "gitleaks download or checksum verification failed"
            fi
            export PATH="$SECREV_TMP/bin:$PATH"
          fi

          # ---------------------------------------------------------------- tool runner
          # run_tool NAME OUTPUT_FILE CMD... : runs CMD with a timeout and records a status file.
          # Tools signal findings through their exit codes, so success means "produced output".
          run_tool() {
            local name=$1 output=$2; shift 2
            if ! command -v "$1" >/dev/null 2>&1; then
              printf '{"status":"error","error":"%s not installed"}\n' "$1" > "$OUT_DIR/$name.status.json"
              log "$name: not installed"; return
            fi
            local start rc status
            start=$(date +%s)
            timeout "$TOOL_TIMEOUT" "$@" > "$SECREV_TMP/$name.stdout" 2> "$SECREV_TMP/$name.stderr"
            rc=$?
            if [ "$rc" -eq 124 ]; then status=timeout
            elif [ -s "$output" ]; then status=ran
            else status=error
            fi
            printf '{"status":"%s","exit_code":%d,"duration_s":%d}\n' "$status" "$rc" "$(( $(date +%s) - start ))" > "$OUT_DIR/$name.status.json"
            [ "$status" = ran ] || tail -c 2000 "$SECREV_TMP/$name.stderr" > "$OUT_DIR/$name.stderr.txt"
            log "$name: $status (exit $rc)"
          }
          skip_tool() { printf '{"status":"skipped","reason":"%s"}\n' "$2" > "$OUT_DIR/$1.status.json"; }
          as_args() { printf '%s\n' "$1" | sed '/^$/d'; }

          # gitleaks: every commit in the PR, so a secret added and later removed is still reported.
          # Repo-level .gitleaks.toml and .gitleaksignore are ignored on purpose; output is redacted.
          : > "$SECREV_TMP/empty.gitleaksignore"
          run_tool gitleaks "$OUT_DIR/gitleaks.sarif" \
            gitleaks git --log-opts="$BASE_SHA..$HEAD_SHA" --config "$SECREV_DIR/gitleaks.toml" \
            --gitleaks-ignore-path "$SECREV_TMP/empty.gitleaksignore" --redact --no-banner \
            --report-format sarif --report-path "$OUT_DIR/gitleaks.sarif" --exit-code 0 .

          # checkov: once per changed IaC directory (keeps Terraform module context, and lets the
          # bundler prefix paths, which checkov reports relative to the scanned directory).
          IAC_DIRS=$(printf '%s\n%s\n%s\n' "$TF_FILES" "$ANSIBLE_FILES" "$DOCKER_FILES" | sed '/^$/d' | xargs -r -n1 dirname | sort -u)
          if [ -z "$IAC_DIRS" ]; then
            skip_tool checkov "no Terraform, Ansible or Dockerfile changes"
          else
            [ "$(printf '%s\n' "$IAC_DIRS" | wc -l)" -gt "$MAX_DIRS" ] && IAC_DIRS="."
            : > "$OUT_DIR/checkov-dirs.txt"
            i=0; ok=0; start=$(date +%s)
            while IFS= read -r dir; do
              i=$((i + 1)); outdir="$SECREV_TMP/checkov-$i"
              printf '%d\t%s\n' "$i" "$dir" >> "$OUT_DIR/checkov-dirs.txt"
              if command -v checkov >/dev/null 2>&1; then
                timeout "$TOOL_TIMEOUT" checkov --directory "$dir" --framework terraform ansible dockerfile \
                  --output sarif --output-file-path "$outdir" --soft-fail --quiet --compact --skip-download \
                  > "$SECREV_TMP/checkov-$i.stdout" 2> "$SECREV_TMP/checkov-$i.stderr"
                if [ -s "$outdir/results_sarif.sarif" ]; then
                  cp "$outdir/results_sarif.sarif" "$OUT_DIR/checkov-$i.sarif"; ok=$((ok + 1))
                fi
              fi
            done <<< "$IAC_DIRS"
            status=error; [ "$ok" -gt 0 ] && status=ran
            printf '{"status":"%s","directories":%d,"duration_s":%d}\n' "$status" "$i" "$(( $(date +%s) - start ))" > "$OUT_DIR/checkov.status.json"
            command -v checkov >/dev/null 2>&1 || echo "checkov not installed" > "$SECREV_TMP/checkov-0.stderr"
            [ "$status" = ran ] || cat "$SECREV_TMP"/checkov-*.stderr 2>/dev/null | tail -c 2000 > "$OUT_DIR/checkov.stderr.txt"
            log "checkov: $status ($ok/$i directories)"
          fi

          # ansible-lint: changed Ansible files only, central config, no Galaxy installs.
          if [ -z "$ANSIBLE_FILES" ]; then
            skip_tool ansible-lint "no Ansible changes"
          else
            mapfile -t files < <(as_args "$ANSIBLE_FILES" | grep -v 'ansible\.cfg$')
            if [ "${#files[@]}" -eq 0 ]; then
              skip_tool ansible-lint "only ansible.cfg changed"
            else
              run_tool ansible-lint "$OUT_DIR/ansible-lint.sarif" \
                ansible-lint --offline --nocolor -q -c "$SECREV_DIR/ansible-lint.yml" \
                --sarif-file "$OUT_DIR/ansible-lint.sarif" "${files[@]}"
            fi
          fi

          # bandit: changed Python files only.
          if [ -z "$PY_FILES" ]; then
            skip_tool bandit "no Python changes"
          else
            mapfile -t files < <(as_args "$PY_FILES")
            run_tool bandit "$OUT_DIR/bandit.sarif" bandit -q --exit-zero -f sarif -o "$OUT_DIR/bandit.sarif" "${files[@]}"
          fi

          # semgrep CE: the p/default registry ruleset (Python, JS/TS, GitHub Actions, secrets).
          # The per-language rulesets are much thinner without a Semgrep login. --baseline-commit
          # keeps only findings this PR introduces.
          if [ -z "$PY_FILES$JS_FILES$GHA_FILES" ]; then
            skip_tool semgrep "no Python, JavaScript/TypeScript or workflow changes"
          else
            run_tool semgrep "$OUT_DIR/semgrep.sarif" \
              semgrep scan --config p/default --baseline-commit "$BASE_SHA" --metrics=off --disable-version-check \
              --quiet --sarif --output "$OUT_DIR/semgrep.sarif" .
          fi

          # zizmor: GitHub Actions workflows (repo-level zizmor config ignored).
          if [ -z "$GHA_FILES" ]; then
            skip_tool zizmor "no GitHub Actions changes"
          else
            online=(--offline)
            [ -n "${GH_TOKEN:-}" ] && online=()
            if command -v zizmor >/dev/null 2>&1; then
              # shellcheck disable=SC2016  # $@ and $0 belong to the inner sh
              run_tool zizmor "$OUT_DIR/zizmor.sarif" \
                sh -c 'zizmor --no-config --format sarif "$@" > "$0"' "$OUT_DIR/zizmor.sarif" "${online[@]}" .github/workflows
            else
              printf '{"status":"error","error":"zizmor not installed"}\n' > "$OUT_DIR/zizmor.status.json"
            fi
          fi

          # ---------------------------------------------------------------- bundle
          python3 "$SECREV_DIR/bundle.py" "$OUT_DIR" "$CHANGED" > "$OUT_DIR/secrev.json" \
            || log "bundling failed"
          log "bundle: $(wc -c < "$OUT_DIR/secrev.json" 2>/dev/null || echo 0) bytes"
          exit 0
          SECREV_EOF
          cat > "$RUNNER_TEMP/secrev/bundle.py" <<'SECREV_EOF'
          #!/usr/bin/env python3
          """Combine scanner SARIF output into one slim JSON bundle for n8n.

          Usage: bundle.py OUT_DIR CHANGED_FILES_LIST > secrev.json

          The bundle drops SARIF snippets and author details on purpose: snippets can contain
          secrets, and n8n only needs rule, location, severity and a short message. n8n still
          treats the bundle as untrusted, because a PR author can edit the caller workflow.
          """
          import json
          import os
          import re
          import sys
          import time
          from pathlib import Path

          TOOLS = ["gitleaks", "checkov", "ansible-lint", "bandit", "semgrep", "zizmor"]
          MAX_RESULTS_PER_TOOL = 300
          MAX_MESSAGE = 400
          VERSION_KEYS = ["GITLEAKS_VERSION", "CHECKOV_VERSION", "SEMGREP_VERSION", "BANDIT_VERSION",
                          "ANSIBLE_LINT_VERSION", "ZIZMOR_VERSION"]


          # Some tools quote the offending value in their message (bandit B105-B107 do).
          QUOTED_SECRET = re.compile(r"(?i)(hardcoded (?:password|secret|token)[^:]*:\s*)(['\"]).*?\2")


          def redact(text):
              return QUOTED_SECRET.sub(lambda m: m.group(1) + m.group(2) + "<redacted>" + m.group(2), text)


          def read_json(path):
              try:
                  return json.loads(Path(path).read_text(encoding="utf-8"))
              except (OSError, ValueError):
                  return None


          def normalize_path(uri, prefix=""):
              path = (uri or "").strip()
              if path.startswith("file://"):
                  path = path[len("file://"):]
              for root in filter(None, [os.environ.get("GITHUB_WORKSPACE"), os.getcwd()]):
                  root = root.rstrip("/") + "/"
                  if path.startswith(root):
                      path = path[len(root):]
              while path.startswith("./"):
                  path = path[2:]
              path = path.lstrip("/")
              if prefix and prefix != "." and not path.startswith(prefix.rstrip("/") + "/"):
                  path = prefix.rstrip("/") + "/" + path
              return path


          def severity_from_score(score):
              try:
                  value = float(score)
              except (TypeError, ValueError):
                  return None
              if value >= 9:
                  return "critical"
              if value >= 7:
                  return "high"
              if value >= 4:
                  return "medium"
              return "low" if value > 0 else None


          def lower_or_none(value):
              return value.lower() if isinstance(value, str) and value else None


          def slim_results(sarif, prefix=""):
              """Flatten SARIF runs into a list of small result dicts."""
              out = []
              if not isinstance(sarif, dict):
                  return out
              for run in sarif.get("runs") or []:
                  rules = {}
                  driver = ((run.get("tool") or {}).get("driver") or {})
                  for rule in driver.get("rules") or []:
                      if isinstance(rule, dict) and rule.get("id"):
                          rules[rule["id"]] = rule
                  for res in run.get("results") or []:
                      if not isinstance(res, dict):
                          continue
                      rule_id = res.get("ruleId") or (res.get("rule") or {}).get("id") or "unknown"
                      rule = rules.get(rule_id, {})
                      props = res.get("properties") or {}
                      rule_props = rule.get("properties") or {}
                      level = res.get("level") or (rule.get("defaultConfiguration") or {}).get("level") or "warning"
                      loc = ((res.get("locations") or [{}])[0] or {}).get("physicalLocation") or {}
                      region = loc.get("region") or {}
                      message = ((res.get("message") or {}).get("text") or
                                 (rule.get("shortDescription") or {}).get("text") or "")
                      severity = (lower_or_none(props.get("issue_severity")) or
                                  severity_from_score(props.get("security-severity")) or
                                  severity_from_score(rule_props.get("security-severity")))
                      fingerprints = res.get("partialFingerprints") or {}
                      out.append({
                          "rule_id": str(rule_id)[:200],
                          "rule_name": str((rule.get("shortDescription") or {}).get("text") or rule.get("name") or "")[:200],
                          "level": str(level)[:20],
                          "message": redact(str(message))[:MAX_MESSAGE],
                          "file": normalize_path((loc.get("artifactLocation") or {}).get("uri"), prefix),
                          "start_line": region.get("startLine"),
                          "end_line": region.get("endLine") or region.get("startLine"),
                          "severity": severity,
                          "confidence": lower_or_none(props.get("issue_confidence")) or lower_or_none(rule_props.get("precision")),
                          "help_uri": str(rule.get("helpUri") or "")[:300],
                          "commit": str(fingerprints.get("commitSha") or "")[:40] or None,
                      })
              return out


          def load_tool(out_dir, name):
              status = read_json(out_dir / f"{name}.status.json") or {"status": "skipped", "reason": "not run"}
              results = []
              if name == "checkov":
                  dirs = {}
                  dirs_file = out_dir / "checkov-dirs.txt"
                  if dirs_file.exists():
                      for line in dirs_file.read_text(encoding="utf-8").splitlines():
                          idx, _, directory = line.partition("\t")
                          dirs[idx] = directory
                  for sarif_path in sorted(out_dir.glob("checkov-*.sarif")):
                      idx = sarif_path.stem.split("-", 1)[1]
                      results += slim_results(read_json(sarif_path), dirs.get(idx, ""))
              else:
                  sarif_path = out_dir / f"{name}.sarif"
                  if sarif_path.exists():
                      sarif = read_json(sarif_path)
                      if sarif is None and status.get("status") == "ran":
                          status = {**status, "status": "error", "error": "invalid SARIF output"}
                      results = slim_results(sarif)
              stderr = out_dir / f"{name}.stderr.txt"
              if status.get("status") in ("error", "timeout") and stderr.exists():
                  status["error"] = (status.get("error") or "") + stderr.read_text(encoding="utf-8", errors="replace")[-600:]
              status["total"] = len(results)
              status["truncated"] = len(results) > MAX_RESULTS_PER_TOOL
              status["results"] = results[:MAX_RESULTS_PER_TOOL]
              return status


          def main():
              out_dir = Path(sys.argv[1])
              changed = Path(sys.argv[2]).read_text(encoding="utf-8").splitlines() if len(sys.argv) > 2 else []
              bundle = {
                  "schema": "secrev-scan/v1",
                  "generated_at": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
                  "meta": {
                      "repo": os.environ.get("SECREV_REPO", ""),
                      "pr_number": os.environ.get("SECREV_PR", ""),
                      "base_sha": os.environ.get("BASE_SHA", ""),
                      "head_sha": os.environ.get("HEAD_SHA", ""),
                      "run_id": os.environ.get("SECREV_RUN_ID", ""),
                      "run_attempt": os.environ.get("SECREV_RUN_ATTEMPT", ""),
                      "domains": os.environ.get("SECREV_DOMAINS", "").split(),
                      "changed_files": len([c for c in changed if c.strip()]),
                      "versions": {k.lower(): os.environ.get(k, "") for k in VERSION_KEYS},
                  },
                  "tools": {name: load_tool(out_dir, name) for name in TOOLS},
              }
              json.dump(bundle, sys.stdout, separators=(",", ":"))


          if __name__ == "__main__":
              main()
          SECREV_EOF
          cat > "$RUNNER_TEMP/secrev/versions.env" <<'SECREV_EOF'
          # Pinned scanner versions. Bump deliberately, then run `python3 scripts/build.py`
          # so the reusable workflow picks them up.
          GITLEAKS_VERSION=8.30.1
          GITLEAKS_SHA256_LINUX_X64=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          CHECKOV_VERSION=3.3.26
          SEMGREP_VERSION=1.180.0
          BANDIT_VERSION=1.9.4
          ANSIBLE_LINT_VERSION=26.9.0
          ANSIBLE_CORE_VERSION=2.21.5
          ZIZMOR_VERSION=1.30.1
          SECREV_EOF
          cat > "$RUNNER_TEMP/secrev/gitleaks.toml" <<'SECREV_EOF'
          # Central gitleaks config used by secrev-scan. Passing it explicitly means a repo's own
          # .gitleaks.toml cannot weaken the rules for its PRs.
          title = "secrev: gitleaks defaults + GMN extras"

          [extend]
          useDefault = true

          [[rules]]
          id = "snmp-community-string"
          description = "SNMP community string in plaintext"
          regex = '''(?i)\b(?:snmp[_-]?)?(?:ro[_-]|rw[_-])?community(?:[_-]?string)?\b["']?\s*[:=]\s*["']?([^\s"'#{}$]{4,})'''
          secretGroup = 1
          keywords = ["community"]

          [[rules]]
          id = "network-device-plaintext-password"
          description = "Plaintext (type 0/7) password in network device configuration"
          regex = '''(?i)\b(?:enable\s+(?:secret|password)|username\s+\S+\s+(?:secret|password))\s+(?:0\s+|7\s+)?([^\s]{4,})'''
          secretGroup = 1
          keywords = ["enable", "username"]

          [[rules]]
          id = "ansible-plaintext-password"
          description = "Plaintext Ansible connection or become password"
          regex = '''\bansible_(?:ssh_|become_)?pass(?:word)?\s*[:=]\s*["']?([^\s"'{}$!][^\s"']{3,})'''
          secretGroup = 1
          keywords = ["ansible_"]
          SECREV_EOF
          cat > "$RUNNER_TEMP/secrev/ansible-lint.yml" <<'SECREV_EOF'
          # Central ansible-lint config used by secrev-scan instead of any repo-level config.
          # Everything runs; n8n keeps only the security-relevant rules (see n8n/code/lib/sarif.js).
          offline: true
          use_default_rules: true
          SECREV_EOF

      - name: Run scanners (report-only)
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          OUT_DIR: ${{ runner.temp }}/secrev-out
          SECREV_DIR: ${{ runner.temp }}/secrev
          SECREV_INSTALL: "1"
          SECREV_REPO: ${{ github.repository }}
          SECREV_PR: ${{ github.event.pull_request.number }}
          SECREV_RUN_ID: ${{ github.run_id }}
          SECREV_RUN_ATTEMPT: ${{ github.run_attempt }}
          GH_TOKEN: ${{ github.token }}
        run: bash "$RUNNER_TEMP/secrev/run-scanners.sh"

      - name: Upload results for the secrev reviewer
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: secrev-scan
          path: ${{ runner.temp }}/secrev-out/secrev.json
          retention-days: 3
          overwrite: true
          if-no-files-found: warn

      - name: Note
        if: always()
        shell: bash
        run: |
          echo "Advisory scan only. The secrev review is posted as a PR comment; this check passing does not mean the PR is secure." >> "$GITHUB_STEP_SUMMARY"
