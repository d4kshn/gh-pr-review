# secrev-scan: reusable, advisory security scan for pull requests.
#
# GENERATED by scripts/build.py from scanners/scan.template.yml and the files in scanners/.
# Edit those sources and rebuild instead of editing this file.
#
# Report-only by design: the job always succeeds and uses no secrets. Results are uploaded
# as the `secrev-scan` artifact, which the n8n reviewer downloads when the run completes.
name: secrev-scan (reusable)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  scan:
    name: secrev-scan (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Write scanner files
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/secrev"
__EMBEDDED_FILES__

      - name: Run scanners (report-only)
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          OUT_DIR: ${{ runner.temp }}/secrev-out
          SECREV_DIR: ${{ runner.temp }}/secrev
          SECREV_INSTALL: "1"
          SECREV_REPO: ${{ github.repository }}
          SECREV_PR: ${{ github.event.pull_request.number }}
          SECREV_RUN_ID: ${{ github.run_id }}
          SECREV_RUN_ATTEMPT: ${{ github.run_attempt }}
          GH_TOKEN: ${{ github.token }}
        run: bash "$RUNNER_TEMP/secrev/run-scanners.sh"

      - name: Upload results for the secrev reviewer
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: secrev-scan
          path: ${{ runner.temp }}/secrev-out/secrev.json
          retention-days: 3
          overwrite: true
          if-no-files-found: warn

      - name: Note
        if: always()
        shell: bash
        run: |
          echo "Advisory scan only. The secrev review is posted as a PR comment; this check passing does not mean the PR is secure." >> "$GITHUB_STEP_SUMMARY"
